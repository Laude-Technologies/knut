[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knuth"
version = "0.1.0"
description = "Scope-enforced web application testing toolkit: logging proxy, repeater, fuzzer, scanner"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
knuth = "knuth.cli:main"

[tool.setuptools.packages.find]
include = ["knuth*"]
